name: testRigor

on:
  push:
    branches: [ "Prod" ]
  workflow_dispatch:

jobs:
  test_sequence:
    runs-on: ubuntu-latest

    steps:
      - name: Run Firehouse Digital - Rewards Testing
        run: |
          echo "Firehouse Digital - Rewards Testing"
          curl -X POST \
            -H 'Content-type: application/json' \
            -H 'auth-token: 7fcfdd73-b01a-446a-949a-3fc90e7411a2' \
            --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
            https://api.testrigor.com/api/v1/apps/PybxPXCt4QxNSnZ3E/retest
          sleep 10

          while true
          do
            echo "==================================="
            echo " Checking TestRigor retest"
            echo "==================================="
            response=$(curl -i -o - -s -X GET 'https://api.testrigor.com/api/v1/apps/PybxPXCt4QxNSnZ3E/status' -H 'auth-token: 7fcfdd73-b01a-446a-949a-3fc90e7411a2' -H 'Accept: application/json')
            code=$(echo "$response" | grep HTTP | awk '{print $2}')
            body=$(echo "$response" | sed -n '/{/,/}/p')
            echo "Status code: " $code
            echo "Response: " $body
            case $code in
              4*|5*) # 400 or 500 errors
                echo "Error calling API"
                exit 1
                ;;
              200) # 200: successfully finished
                echo "Test finished successfully"
                break
                ;;
              227|228) # 227: New - 228: In progress
                echo "Test is not finished yet"
                ;;
              230) # 230: Failed
                echo "Test finished but failed"
                exit 1
                ;;
              *) # Any other status code
                echo "Unknown status"
                exit 1
                ;;
            esac
            sleep 10
          done

      - name: Run Firehouse Digital - Github Integration
        run: |
          echo "Firehouse Digital - Github Integration"
          curl -X POST \
            -H 'Content-type: application/json' \
            -H 'auth-token: 53fd83f4-d9f4-44f9-b8a8-490e86934ac5' \
            --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
            https://api.testrigor.com/api/v1/apps/joYxqWB3qEqwRtpTt/retest
          sleep 10

          while true
          do
            echo "==================================="
            echo " Checking TestRigor retest"
            echo "==================================="
            response=$(curl -i -o - -s -X GET 'https://api.testrigor.com/api/v1/apps/joYxqWB3qEqwRtpTt/status' -H 'auth-token: 53fd83f4-d9f4-44f9-b8a8-490e86934ac5' -H 'Accept: application/json')
            code=$(echo "$response" | grep HTTP | awk '{print $2}')
            body=$(echo "$response" | sed -n '/{/,/}/p')
            echo "Status code: " $code
            echo "Response: " $body
            case $code in
              4*|5*) # 400 or 500 errors
                echo "Error calling API"
                exit 1
                ;;
              200) # 200: successfully finished
                echo "Test finished successfully"
                break
                ;;
              227|228) # 227: New - 228: In progress
                echo "Test is not finished yet"
                ;;
              230) # 230: Failed
                echo "Test finished but failed"
                exit 1
                ;;
              *) # Any other status code
                echo "Unknown status"
                exit 1
                ;;
            esac
            sleep 10
          done

      - name: Run Toast Menu Testing-POC
        run: |
          echo "Toast Menu Testing-POC"
          curl -X POST \
            -H 'Content-type: application/json' \
            -H 'auth-token: ac4f1ed1-3da1-4f1d-bfff-6f10af71a8b7' \
            --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
            https://api.testrigor.com/api/v1/apps/JZW9ziTzGkZ2GSzkm/retest
          sleep 10

          while true
          do
            echo "==================================="
            echo " Checking TestRigor retest"
            echo "==================================="
            response=$(curl -i -o - -s -X GET 'https://api.testrigor.com/api/v1/apps/JZW9ziTzGkZ2GSzkm/status' -H 'auth-token: ac4f1ed1-3da1-4f1d-bfff-6f10af71a8b7' -H 'Accept: application/json')
            code=$(echo "$response" | grep HTTP | awk '{print $2}')
            body=$(echo "$response" | sed -n '/{/,/}/p')
            echo "Status code: " $code
            echo "Response: " $body
            case $code in
              4*|5*) # 400 or 500 errors
                echo "Error calling API"
                exit 1
                ;;
              200) # 200: successfully finished
                echo "Test finished successfully"
                break
                ;;
              227|228) # 227: New - 228: In progress
                echo "Test is not finished yet"
                ;;
              230) # 230: Failed
                echo "Test finished but failed"
                exit 1
                ;;
              *) # Any other status code
