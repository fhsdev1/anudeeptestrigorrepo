# This is a basic workflow to help you get started with Actions

name: testRigor

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "Prod" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
                # First API call
                echo "Firehouse Digital - Rewards Testing"
                curl -X POST \
                  -H 'Content-type: application/json' \
                  -H 'auth-token: ac4f1ed1-3da1-4f1d-bfff-6f10af71a8b7' \
                  --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
                  https://api.testrigor.com/api/v1/apps/JZW9ziTzGkZ2GSzkm/retest

                # Second API call
                echo "Firehouse Digital - Github Integration"
                curl -X POST \
                  -H 'Content-type: application/json' \
                  -H 'auth-token: 7fcfdd73-b01a-446a-949a-3fc90e7411a2' \
                  --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
                  https://api.testrigor.com/api/v1/apps/PybxPXCt4QxNSnZ3E/retest

                # Third API call
                echo "Toast Menu Testing-POC"
                curl -X POST \
                  -H 'Content-type: application/json' \
                  -H 'auth-token: 53fd83f4-d9f4-44f9-b8a8-490e86934ac5' \
                  --data '{"forceCancelPreviousTesting":true,"storedValues":{"storedValueName1":"Value"}}' \
                  https://api.testrigor.com/api/v1/apps/joYxqWB3qEqwRtpTt/retest
                  
                sleep 10

                while true
                    do
                      echo " "
                      echo "==================================="
                      echo " Checking TestRigor retest"
                      echo "==================================="

                      # Function to check API status
                      check_status() {
                        app_id=$1
                        auth_token=$2
                        response=$(curl -i -o - -s -X GET "https://api.testrigor.com/api/v1/apps/$app_id/status" -H "auth-token: $auth_token" -H 'Accept: application/json')
                        code=$(echo "$response" | grep HTTP | awk '{print $2}')
                        body=$(echo "$response" | sed -n '/{/,/}/p')
                        
                        echo "Status code: $code"
                        echo "Response: $body"
                        
                        echo $code
                      }

                      # Test apps info (you can change these if needed)
                      apps=("JZW9ziTzGkZ2GSzkm:ac4f1ed1-3da1-4f1d-bfff-6f10af71a8b7" "PybxPXCt4QxNSnZ3E:7fcfdd73-b01a-446a-949a-3fc90e7411a2" "joYxqWB3qEqwRtpTt:53fd83f4-d9f4-44f9-b8a8-490e86934ac5")

                      # Loop through each app and check status
                      for app in "${apps[@]}"; do
                        app_id=$(echo $app | cut -d ':' -f 1)
                        auth_token=$(echo $app | cut -d ':' -f 2)
                        
                        # Call function to get status
                        code=$(check_status $app_id $auth_token)

                        case $code in
                          4*|5*)
                            # 400 or 500 errors
                            echo "Error calling API"
                            exit 1
                            ;;
                          200)
                            # 200: successfully finished
                            echo "Test finished successfully"
                            exit 0
                            ;;
                          227|228)
                            # 227: New - 228: In progress
                            echo "Test is not finished yet"
                            ;;
                          230)
                            # 230: Failed
                            echo "Test finished but failed"
                            exit 1
                            ;;
                          *)
                            echo "Unknown status"
                            exit 1
                            ;;
                        esac
                      done
                      
                      # Sleep for 10 seconds before checking again
                      sleep 10
                    done

